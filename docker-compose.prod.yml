services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./api/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/o-clock-selkie/projet-green-roots-api:latest}
    pull_policy: always
    env_file:
      - ./api/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "3000"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/o-clock-selkie/projet-green-roots-web:latest}
    pull_policy: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
