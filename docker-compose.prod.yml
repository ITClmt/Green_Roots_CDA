# DOCKER COMPOSE
services:
  postgres:
    image: postgres:17-alpine
    environment: &api-env
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5432:5432"
    networks:
      - internal
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-ghcr.io/ryzenixx/projet-green-roots-api:latest}
    pull_policy: always
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "3000"
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/ryzenixx/projet-green-roots-web:latest}
    pull_policy: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
