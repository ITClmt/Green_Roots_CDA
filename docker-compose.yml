services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./api/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5435:5432"
    restart: unless-stopped

  api:
    build:
      context: ./api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./api/.env
    volumes:
      - ./api/src:/app/src
    ports:
      - "3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./web
    depends_on:
      - api
    volumes:
      - ./web/src:/app/src
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  pg_data:
